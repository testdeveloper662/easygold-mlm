name: Deploy to Staging

on:
  push:
    branches:
      - kretoss-latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sanity-check install (catches a broken package-lock/syntax before touching the server)
        run: npm ci

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /home/mlmapi-stage/public_html
            git fetch origin kretoss-latest
            git reset --hard origin/kretoss-latest
            npm ci
            npm run db:deploy
            pm2 restart mlm-backend-stage-3005
            pm2 save

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            sleep 3
            curl -sf http://localhost:3005/ > /dev/null && echo "Staging is up" || (echo "Health check failed" && exit 1)
